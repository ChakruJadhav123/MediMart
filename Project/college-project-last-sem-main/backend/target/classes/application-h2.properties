# H2 Database Configuration (for demo purposes)
server.port=8080
spring.application.name=medimart-backend

# H2 Database
spring.datasource.url=jdbc:h2:mem:medimart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Data Initialization (disabled for now)
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:data.sql

# JWT
app.jwt.secret=MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads/prescriptions

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.medimart=DEBUG
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health,info
