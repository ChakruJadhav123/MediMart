# Production Environment Configuration
server.port=8080
spring.application.name=medimart-backend

# MySQL Database (Production - Use environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medimart_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (Production)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Connection Pooling (Production)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000

# JWT
app.jwt.secret=${JWT_SECRET:MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation}
app.jwt.expiration=86400000
app.jwt.refreshExpiration=604800000

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=${UPLOAD_DIR:./uploads/prescriptions}

# CORS (Production)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://yourdomain.com}

# Logging (Production)
logging.level.com.medimart=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/medimart.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator (Production)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
