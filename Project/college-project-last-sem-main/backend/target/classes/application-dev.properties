# Development Environment Configuration
server.port=8080
spring.application.name=medimart-backend

# MySQL Database (Development)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medimart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate (Development)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=${JWT_SECRET:MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refreshExpiration=${JWT_REFRESH_EXPIRATION:604800000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads/prescriptions}

# CORS (Development)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging (Development)
logging.level.com.medimart=${LOGGING_LEVEL:DEBUG}
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info,beans
