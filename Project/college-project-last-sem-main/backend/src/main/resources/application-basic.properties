# Basic Configuration for College Project Demo
server.port=8080

# H2 Database - Basic Setup
spring.datasource.url=jdbc:h2:mem:medimart
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Basic Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT - Basic Configuration
app.jwt.secret=MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation
app.jwt.expiration=86400000

# CORS - Basic Configuration
app.cors.allowed-origins=http://localhost:3000

# Logging - Minimal
logging.level.root=WARN
