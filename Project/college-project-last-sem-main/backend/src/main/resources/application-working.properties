# Working Configuration for College Project Demo
server.port=8081

# H2 Database - Working Setup
spring.datasource.url=jdbc:h2:mem:medimart
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false

# Disable data initialization completely
spring.sql.init.mode=never

# JWT Configuration
app.jwt.secret=MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation
app.jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.root=WARN
logging.level.com.medimart=INFO
