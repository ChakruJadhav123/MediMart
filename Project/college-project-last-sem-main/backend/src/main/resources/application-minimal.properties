# Minimal Working Configuration for College Project
server.port=8080
spring.application.name=medimart-backend

# H2 Database - Minimal Setup
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - Minimal
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT
app.jwt.secret=MediMartSecretKey2024SuperLongSecretKeyForJWTTokenGenerationAndValidation
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Logging
logging.level.com.medimart=WARN
logging.level.org.springframework.security=WARN
